<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel da Noiva — Sua central de organização</title>
<meta name="theme-color" content="#FBF8F4" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='20' r='8' fill='none' stroke='%23BFA269' stroke-width='2.4'/%3E%3Cpath d='M12 10l4-6 4 6-4 4z' fill='%23E8CFC9' stroke='%23BFA269' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet" />
<style>
:root{
  --ivory:#FBF8F4;--cream:#F6F0E8;--cream-2:#EFE6DA;--panel:#FFFFFF;
  --ink:#332B24;--ink-soft:#6E6157;--nude:#8A7B70;--line:#ECE3D6;--line-2:#E4D9C9;
  --rose:#D08B84;--rose-d:#C07A73;--rose-soft:#EBD2CC;--rose-bg:#F8ECE8;
  --gold:#BFA269;--gold-soft:#DBC79E;--sage:#8FA47E;--sage-bg:#EAF0E3;
  --amber-bg:#FBEED9;--amber-t:#B5852F;
  --red:#CF7A72;--red-bg:#F8E6E3;
  --shadow-xs:0 1px 3px rgba(120,98,74,.06);
  --shadow-sm:0 4px 16px -8px rgba(120,98,74,.18);
  --shadow-md:0 18px 44px -20px rgba(96,74,52,.28);
  --shadow-lg:0 40px 90px -30px rgba(96,74,52,.4);
  --r:18px;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--script:"Parisienne",cursive;
  --ease:cubic-bezier(.22,.61,.36,1);--sidebar:264px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;line-height:1.1}
p{margin:0}a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.script{font-family:var(--script);color:var(--rose);font-weight:400}
::selection{background:var(--rose-soft)}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;
  padding:12px 20px;border-radius:12px;border:1px solid transparent;transition:transform .25s var(--ease),box-shadow .25s,background .2s,border-color .2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--rose),var(--rose-d));color:#fff;box-shadow:0 10px 22px -12px rgba(192,122,115,.8)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 30px -12px rgba(192,122,115,.85)}
.btn-ghost{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-soft);transform:translateY(-2px)}
.btn-soft{background:var(--rose-bg);color:var(--rose-d)}
.btn-soft:hover{background:var(--rose-soft)}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:transparent}
.btn-danger:hover{background:#f2d7d2}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- Auth screens ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth-art{position:relative;background:linear-gradient(150deg,#F3E4DE,#F6EFE6 55%,#EFE7D9);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:60px}
.auth-art .blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.5}
.auth-art .b1{width:340px;height:340px;background:radial-gradient(circle,#E7C9C1,transparent 70%);top:-60px;left:-40px}
.auth-art .b2{width:420px;height:420px;background:radial-gradient(circle,#E4D2A8,transparent 70%);bottom:-120px;right:-80px}
.auth-quote{position:relative;z-index:2;max-width:420px;text-align:center}
.auth-quote .ring{width:56px;height:56px;margin:0 auto 24px}
.auth-quote h2{font-size:2.4rem;line-height:1.15}
.auth-quote .script{font-size:2rem;display:block;margin-top:10px}
.auth-quote p{color:var(--ink-soft);margin-top:18px}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:400px;animation:fadeUp .6s var(--ease)}
.auth-brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.4rem;font-weight:600;margin-bottom:30px}
.auth-brand .ring{width:28px;height:28px}
.auth-card h1{font-size:2.1rem;margin-bottom:6px}
.auth-card .sub{color:var(--ink-soft);margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:7px}
.inp,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:13px 14px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-bg)}
.field textarea{min-height:90px;resize:vertical}
.pw-wrap{position:relative}
.pw-wrap .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--nude);padding:6px;display:grid;place-items:center}
.field-row{display:flex;gap:14px}.field-row>*{flex:1}
.check-row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px;font-size:.86rem}
.check-row label{display:flex;align-items:center;gap:8px;color:var(--ink-soft);cursor:pointer}
.link{color:var(--rose-d);font-weight:600}
.link:hover{text-decoration:underline}
.form-err{background:var(--red-bg);color:#b5544b;font-size:.85rem;padding:11px 13px;border-radius:10px;margin-bottom:16px;display:none;align-items:center;gap:8px}
.form-err.show{display:flex}
.auth-alt{text-align:center;margin-top:22px;font-size:.9rem;color:var(--ink-soft)}
.demo-hint{margin-top:20px;font-size:.78rem;color:var(--nude);background:var(--cream);border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px}

/* ---------- Onboarding ---------- */
.onb{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(1200px 600px at 50% -10%,#F5E7E1,transparent),var(--ivory)}
.onb-card{width:100%;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-lg);padding:40px;animation:fadeUp .5s var(--ease)}
.onb-steps{display:flex;gap:8px;margin-bottom:28px}
.onb-steps i{height:5px;flex:1;border-radius:5px;background:var(--cream-2);transition:background .4s}
.onb-steps i.on{background:linear-gradient(90deg,var(--rose),var(--gold-soft))}
.onb-card .eyebrow{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.onb-card h2{font-size:2rem;margin:10px 0 6px}
.onb-card .lead{color:var(--ink-soft);margin-bottom:26px}
.onb-actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.avatar-upload{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.avatar-prev{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--rose-soft),var(--gold-soft));display:grid;place-items:center;font-family:var(--serif);font-size:2rem;color:#fff;overflow:hidden;flex:0 0 auto}
.avatar-prev img{width:100%;height:100%;object-fit:cover}
.onb-done{text-align:center;padding:20px 0}
.onb-done .big-ring{width:90px;height:90px;margin:0 auto 20px;animation:pop .6s var(--ease)}
.onb-done h2{font-size:2.2rem}

/* ---------- App shell ---------- */
.app{display:none;min-height:100vh}
.app.on{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);background:var(--cream);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:transform .35s var(--ease)}
.sb-brand{padding:22px 22px 14px;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.3rem;font-weight:600}
.sb-brand .ring{width:26px;height:26px}
.sb-profile{padding:6px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.sb-avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--rose-soft),var(--gold-soft));display:grid;place-items:center;font-family:var(--serif);font-size:1.8rem;color:#fff;overflow:hidden;box-shadow:var(--shadow-sm)}
.sb-avatar img{width:100%;height:100%;object-fit:cover}
.sb-profile .nm{font-family:var(--serif);font-size:1.15rem}
.sb-profile .days{font-size:.76rem;color:var(--nude);margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 12px 20px}
.sb-nav::-webkit-scrollbar{width:6px}.sb-nav::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:11px;color:var(--ink-soft);font-size:.9rem;font-weight:500;cursor:pointer;transition:background .2s,color .2s;margin-bottom:2px}
.nav-item .ic{width:20px;height:20px;flex:0 0 auto;opacity:.85}
.nav-item:hover{background:#fff;color:var(--ink)}
.nav-item.active{background:#fff;color:var(--rose-d);box-shadow:var(--shadow-xs);font-weight:600}
.nav-item.active .ic{opacity:1}
.nav-sep{height:1px;background:var(--line);margin:10px 10px}
.sb-foot{padding:12px 16px;border-top:1px solid var(--line)}

.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(251,248,244,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.topbar h1{font-size:1.7rem}
.topbar h1 .script{font-size:1.9rem}
.tb-left{display:flex;align-items:center;gap:14px;min-width:0}
.tb-burger{display:none;background:none;border:0;padding:6px}
.tb-right{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.tb-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:9px 13px;font-size:.85rem;color:var(--ink-soft);font-weight:500}
.tb-search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:0 12px;max-width:220px}
.tb-search input{border:0;outline:0;padding:9px 0;background:none;width:100%}
.bell{position:relative;width:42px;height:42px;border-radius:11px;background:#fff;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-soft)}
.bell .badge{position:absolute;top:-5px;right:-5px;background:var(--rose);color:#fff;font-size:.64rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.content{padding:30px;flex:1;max-width:1400px;width:100%;margin:0 auto}
.page-head{margin-bottom:22px}
.page-head h2{font-size:2rem}
.page-head .sub{color:var(--ink-soft);margin-top:4px}
.page-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}

/* ---------- Cards & grid ---------- */
.grid{display:grid;gap:18px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-xs);transition:box-shadow .3s,transform .3s}
.card.hover:hover{box-shadow:var(--shadow-sm);transform:translateY(-3px)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-head h3{font-size:1.3rem}
.card-head .ic{width:34px;height:34px;border-radius:10px;background:var(--rose-bg);display:grid;place-items:center;color:var(--rose-d)}
.card-link{font-size:.82rem;color:var(--rose-d);font-weight:600}
.stat-lbl{font-size:.82rem;color:var(--nude)}
.stat-num{font-family:var(--serif);font-size:2rem;line-height:1.1}
.muted{color:var(--nude)}
.reveal{opacity:0;transform:translateY(18px);animation:fadeUp .6s var(--ease) forwards}

/* countdown card */
.countdown{display:flex;align-items:center;gap:18px}
.countdown .cal{width:56px;height:56px;border-radius:14px;background:var(--rose-bg);display:grid;place-items:center;color:var(--rose-d);flex:0 0 auto}
.countdown .big{font-family:var(--serif);font-size:3rem;line-height:.9}
.countdown .dt{font-size:.85rem;color:var(--ink-soft);margin-top:6px;display:flex;align-items:center;gap:6px}
/* progress ring */
.ring-card{display:flex;align-items:center;gap:20px}
.ring-svg{width:96px;height:96px;flex:0 0 auto}
.ring-svg circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring-bg{stroke:var(--cream-2)}
.ring-fg{stroke:url(#ringGrad);transition:stroke-dashoffset 1.4s var(--ease)}
.ring-pct{font-family:var(--serif);font-size:1.5rem}
/* mini bars */
.progress{height:8px;border-radius:8px;background:var(--cream-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--rose),var(--gold-soft));width:0;transition:width 1.2s var(--ease)}

/* list / table */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;background:#fff;min-width:640px}
table.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--nude);font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--cream)}
table.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr:hover td{background:#FCF9F5}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;color:var(--ink-soft);transition:.2s}
.icon-btn:hover{border-color:var(--rose-soft);color:var(--rose-d)}
.icon-btn.danger:hover{color:var(--red);border-color:var(--red-bg)}
.badge-s{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.badge-s::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-green{background:var(--sage-bg);color:#5f7a51}.s-amber{background:var(--amber-bg);color:var(--amber-t)}
.s-rose{background:var(--rose-bg);color:var(--rose-d)}.s-red{background:var(--red-bg);color:#b5544b}
.s-gray{background:var(--cream-2);color:var(--nude)}

/* segmented / chips / filters */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-size:.82rem;color:var(--ink-soft);font-weight:500;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--gold-soft)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:0 0 auto}
.donut circle{fill:none;stroke-width:16}
.legend{display:flex;flex-direction:column;gap:12px}
.legend div{display:flex;align-items:center;gap:10px;font-size:.9rem}
.legend b{font-family:var(--serif);font-size:1.1rem;min-width:30px}
.legend .k{width:11px;height:11px;border-radius:3px;flex:0 0 auto}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--rose-soft),var(--gold-soft))}
.tl-item{position:relative;padding:10px 0}
.tl-item::before{content:"";position:absolute;left:-26px;top:15px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--rose)}
.tl-item .time{font-family:var(--serif);font-size:1.1rem;color:var(--rose-d)}
.tl-item .ev{font-weight:600;font-size:.92rem}.tl-item .pl{font-size:.76rem;color:var(--nude)}

/* checklist */
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .box{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--rose-soft);flex:0 0 auto;display:grid;place-items:center;color:#fff;cursor:pointer;transition:.25s;margin-top:1px}
.task.done .box{background:var(--sage);border-color:var(--sage);animation:pop .35s var(--ease)}
.task.done .tt{color:var(--nude);text-decoration:line-through}
.task .tt{font-size:.92rem;font-weight:500}
.task .meta{font-size:.74rem;color:var(--nude);margin-top:2px}
.task .rm{margin-left:auto;opacity:0;transition:.2s}
.task:hover .rm{opacity:1}

/* empty state */
.empty{text-align:center;padding:44px 20px;border:1.5px dashed var(--line-2);border-radius:16px;background:#FCFAF6}
.empty .em-ic{width:60px;height:60px;border-radius:16px;background:var(--rose-bg);display:grid;place-items:center;margin:0 auto 16px;color:var(--rose-d)}
.empty h3{font-size:1.4rem;margin-bottom:6px}
.empty p{color:var(--ink-soft);margin-bottom:18px}

/* gallery grid */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gal .tile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--cream-2);border:1px solid var(--line)}
.gal .tile img{width:100%;height:100%;object-fit:cover}
.gal .tile .rm{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);border-radius:8px}
.gal .add{aspect-ratio:1;border:1.5px dashed var(--line-2);border-radius:14px;display:grid;place-items:center;color:var(--nude);cursor:pointer;background:#fff;transition:.2s}
.gal .add:hover{border-color:var(--rose-soft);color:var(--rose-d)}

/* IA placeholder */
.ia-shell{text-align:center;padding:40px}
.ia-orb{width:74px;height:74px;border-radius:50%;margin:0 auto 20px;background:radial-gradient(circle at 35% 30%,#F3D9D2,#D08B84);box-shadow:0 12px 30px -10px rgba(208,139,132,.6);animation:float 4s ease-in-out infinite}
.soon{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--cream);border:1px solid var(--gold-soft);padding:4px 10px;border-radius:999px}

/* alert */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;font-size:.9rem}
.alert.warn{background:var(--amber-bg);color:var(--amber-t)}
.alert.info{background:var(--rose-bg);color:var(--rose-d)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(60,46,38,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex;animation:fade .25s}
.modal{background:#fff;border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:pop .3s var(--ease)}
.modal-head{padding:24px 26px 0;display:flex;justify-content:space-between;align-items:flex-start}
.modal-head h3{font-size:1.6rem}
.modal-x{background:none;border:0;font-size:1.6rem;color:var(--nude);line-height:1}
.modal-body{padding:20px 26px}
.modal-foot{padding:16px 26px 24px;display:flex;gap:12px;justify-content:flex-end;border-top:1px solid var(--line);margin-top:4px}
.confirm .modal{max-width:420px;text-align:center}
.confirm .c-ic{width:56px;height:56px;border-radius:16px;background:var(--red-bg);color:var(--red);display:grid;place-items:center;margin:26px auto 4px}

/* toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:120;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--sage);border-radius:12px;box-shadow:var(--shadow-md);padding:13px 16px;display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:500;min-width:240px;animation:slideIn .35s var(--ease)}
.toast.err{border-left-color:var(--red)}
.toast .ti{color:var(--sage)}.toast.err .ti{color:var(--red)}

/* notif dropdown */

/* ---------------- Crypto (hash de senha) ---------------- */
async function sha256(str){
  try{
    if(crypto && crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  // Fallback (prototype only) for non-secure contexts. Real hashing lives on the backend.
  let h1=0xdeadbeef,h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i);
    h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return "fb"+(h2>>>0).toString(16).padStart(8,"0")+(h1>>>0).toString(16).padStart(8,"0");
}

function parseDate(iso){ if(!iso)return null; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDate(iso){ const d=parseDate(iso); if(!d)return "—"; return d.toLocaleDateString("pt-BR"); }

/* ---------------- Session & Auth ---------------- */
function currentSession(){
  const s = DB.get(K.session, null);
  if(!s) return null;
  if(s.expires && Date.now() > s.expires){ DB.del(K.session); return null; }
  return s;
}
function currentUser(){
  const s = currentSession(); if(!s) return null;
  return DB.get(K.users, []).find(u=>u.id===s.userId) || null;
}
function saveUser(u){ const us=DB.get(K.users,[]); const i=us.findIndex(x=>x.id===u.id); if(i>=0)us[i]=u; else us.push(u); DB.set(K.users,us); }
function getWedding(id){ return DB.get(K.wedding(id), blankWedding()); }
function saveWedding(id,w){ DB.set(K.wedding(id), w); }
function getData(id){ const d=DB.get(K.data(id), null); if(!d){ const b=blankData(); DB.set(K.data(id),b); return b; } // backfill new keys
  const b=blankData(); for(const k in b){ if(!(k in d)) d[k]=b[k]; } return d; }
function saveData(id,d){ DB.set(K.data(id), d); }

async function doLogin(email, password, remember){
  const u = DB.get(K.users, []).find(x=>x.email.toLowerCase()===email.toLowerCase().trim());
  if(!u) return {ok:false, msg:"E-mail ou senha incorretos."};
  const hash = await sha256(password);
  if(hash !== u.passwordHash) return {ok:false, msg:"E-mail ou senha incorretos."};
  if(u.accessStatus==="blocked") return {ok:false, blocked:true};
  u.lastLoginAt = Date.now(); saveUser(u);
  DB.set(K.session, {userId:u.id, expires: Date.now() + (remember?30:1)*86400000, remember:!!remember});
  return {ok:true, user:u};
}
async function createBride(email, password){
  const us = DB.get(K.users, []);
  if(us.some(x=>x.email.toLowerCase()===email.toLowerCase().trim()))
    return {ok:false, msg:"Já existe uma conta com este e-mail."};
  const id = uid();
  us.push({ id, email:email.trim(), passwordHash:await sha256(password), role:"bride",
    accessStatus:"active", createdAt:Date.now(), lastLoginAt:Date.now(),
    purchasePlatform:"manual", purchaseId:null });
  DB.set(K.users, us);
  saveWedding(id, blankWedding());   // starts EMPTY
  saveData(id, blankData());         // starts EMPTY
  DB.set(K.session, {userId:id, expires: Date.now()+86400000, remember:false});
  return {ok:true, id};
}
function logout(){ DB.del(K.session); location.hash="#/login"; }

/* ---------------- Calculations (single source of truth) ---------------- */
function calcSuppliers(d){
  const contracted = d.suppliers.reduce((s,x)=>s+(+x.valorTotal||0),0);
  const paid = d.suppliers.reduce((s,x)=>s+(+x.valorPago||0),0);
  return { contracted, paid, toPay: contracted-paid, count:d.suppliers.length };
}
function calcGuests(d){
  const c={confirmado:0,aguardando:0,nao_ira:0};
  d.guests.forEach(g=>{ c[g.status]=(c[g.status]||0)+1; });
  return { total:d.guests.length, confirmed:c.confirmado, waiting:c.aguardando, declined:c.nao_ira };
}
function calcTasks(d){
  const total=d.tasks.length, done=d.tasks.filter(t=>t.status==="concluida").length;
  return { total, done, pct: total? Math.round(done/total*100):0 };
}
function calcPayments(d){
  autoOverdue(d);
  const by=s=>d.payments.filter(p=>p.status===s).reduce((a,p)=>a+(+p.value||0),0);
  return { paid:by("pago"), pending:by("pendente"), overdue:by("atrasado"),
    total:d.payments.reduce((a,p)=>a+(+p.value||0),0), count:d.payments.length };
}
function autoOverdue(d){
  const today=new Date(); today.setHours(0,0,0,0);
  d.payments.forEach(p=>{ if(p.status==="pendente" && p.due){ const dd=parseDate(p.due); if(dd && dd<today) p.status="atrasado"; } });
}
/* Progresso geral ponderado (spec §19) */
function calcProgress(w,d){
  const t=calcTasks(d);
  const essential=["Espaço","Buffet","Fotógrafo","Decoração"];
  const contractedEss = essential.filter(cat=>
    d.suppliers.some(s=>s.category===cat && (s.status==="contratado"||s.status==="pago"))).length;
  const parts=[
    { w:50, v: t.total? t.done/t.total : 0 },                                   // checklist
    { w:15, v: contractedEss/essential.length },                                // fornecedores essenciais
    { w:10, v: (+w.budgetTotal>0)?1:0 },                                        // orçamento configurado
    { w:10, v: Math.min(d.timeline.length/4,1) },                              // cronograma
    { w:5,  v: (w.brideName&&w.partnerName&&w.date&&w.city)?1:0 },             // informações
    { w:5,  v: Math.min(d.party.length/1,1) },                                 // padrinhos
    { w:5,  v: Math.min(d.documents.length/1,1) }                             // documentos
  ];
  const total=parts.reduce((a,p)=>a+p.w,0);
  const got=parts.reduce((a,p)=>a+p.w*p.v,0);
  return Math.round(got/total*100);
}
function progressMsg(p){
  if(p>=100) return "Tudo preparado! Agora aproveite ❤️";
  if(p>=81) return "Está quase tudo pronto!";
  if(p>=51) return "Seu grande dia está tomando forma!";
  if(p>=21) return "Você está avançando!";
  return "Seu sonho está começando 💍";
}
/* Notificações derivadas por regras */
function buildNotifications(w,d){
  const out=[]; const days=daysUntil(w.date);
  const marks=[365,180,100,60,30,15,7,1];
  if(days!=null && marks.includes(days)) out.push({ic:"heart",text:`Faltam ${days} dias para o casamento!`});
  const g=calcGuests(d); if(g.waiting>0) out.push({ic:"users",text:`${g.waiting} convidado(s) aguardando confirmação.`});
  const soon=d.payments.filter(p=>{ if(p.status==="pago")return false; const dd=daysUntil(p.due); return dd!=null&&dd>=0&&dd<=3; });
  soon.forEach(p=>out.push({ic:"card",text:`Pagamento "${p.description}" vence em breve.`}));
  const over=d.payments.filter(p=>p.status==="atrasado"); if(over.length) out.push({ic:"warn",text:`${over.length} pagamento(s) em atraso.`});
  const dueTasks=d.tasks.filter(t=>t.status!=="concluida"&&t.due&&daysUntil(t.due)!=null&&daysUntil(t.due)<=7&&daysUntil(t.due)>=0);
  if(dueTasks.length) out.push({ic:"check",text:`${dueTasks.length} tarefa(s) vencendo esta semana.`});
  return out;
}

/* ---------------- Generic form modal ---------------- */
/* fields: [{key,label,type,options,required,placeholder,half,step,min}] */
function formModal({title, fields, values={}, submitLabel="Salvar", onSubmit}){
  const m=el("div",{class:"modal"});
  const body=fields.map(f=>{
    const v = values[f.key]!=null?values[f.key]:"";
    const req = f.required?"required":"";
    let input;
    if(f.type==="select"){
      input=`<select name="${f.key}" ${req}>${(f.options||[]).map(o=>{
        const val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o;
        return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(lab)}</option>`; }).join("")}</select>`;
    } else if(f.type==="textarea"){
      input=`<textarea name="${f.key}" placeholder="${esc(f.placeholder||"")}" ${req}>${esc(v)}</textarea>`;
    } else {
      const step=f.step?`step="${f.step}"`:""; const min=f.min!=null?`min="${f.min}"`:"";
      input=`<input name="${f.key}" type="${f.type||"text"}" value="${esc(v)}" placeholder="${esc(f.placeholder||"")}" ${req} ${step} ${min} />`;
    }
    return `<div class="field ${f.half?"half":""}">${f.label?`<label>${esc(f.label)}${f.required?" *":""}</label>`:""}${input}</div>`;
  });
  // group halves in rows
  let bodyHtml=""; for(let i=0;i<fields.length;i++){
    if(fields[i].half && fields[i+1] && fields[i+1].half){ bodyHtml+=`<div class="field-row">${body[i]}${body[i+1]}</div>`; i++; }
    else bodyHtml+=body[i];
  }
  m.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="modal-x" data-x>&times;</button></div>
    <form><div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-x>Cancelar</button>
      <button type="submit" class="btn btn-primary">${esc(submitLabel)}</button></div></form>`;
  openModal(m);
  qa("[data-x]",m).forEach(b=>b.onclick=closeModal);
  q("form",m).onsubmit=e=>{ e.preventDefault();
    const fd=new FormData(e.target); const obj={}; fields.forEach(f=>{ obj[f.key]=fd.get(f.key); });
    onSubmit(obj); };
}

/* ---------------- Animated donut & ring builders ---------------- */
function ringSVG(pct){
  const r=42, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg class="ring-svg" viewBox="0 0 100 100">
    <circle class="ring-bg" cx="50" cy="50" r="${r}"></circle>
    <circle class="ring-fg" cx="50" cy="50" r="${r}" transform="rotate(-90 50 50)"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"></circle></svg>`;
}
function donutSVG(segments){ // segments:[{v,color}]
  const total=segments.reduce((a,s)=>a+s.v,0)||1; const r=40,c=2*Math.PI*r; let acc=0;
  const circles=segments.map(s=>{ const frac=s.v/total; const dash=c*frac;
    const el=`<circle cx="50" cy="50" r="${r}" stroke="${s.color}" stroke-dasharray="0 ${c}"
      data-dash="${dash} ${c-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"
      style="transition:stroke-dasharray 1s var(--ease)"></circle>`; acc+=dash; return el; });
  return `<svg class="donut" viewBox="0 0 100 100">${circles.join("")}</svg>`;
}
function animateVisuals(root){
  qa(".ring-fg",root).forEach(c=>{ requestAnimationFrame(()=>{ setTimeout(()=>{ c.style.strokeDashoffset=c.dataset.off; },60); }); });
  qa(".donut circle[data-dash]",root).forEach(c=>{ requestAnimationFrame(()=>{ setTimeout(()=>{ c.setAttribute("stroke-dasharray", c.dataset.dash); },80); }); });
  qa(".progress i[data-w]",root).forEach(i=>{ requestAnimationFrame(()=>{ setTimeout(()=>{ i.style.width=i.dataset.w+"%"; },80); }); });
  qa("[data-count]",root).forEach(n=>{ countUp(n, +n.dataset.count); });
}
function countUp(node,target,dur=1100){
  const money=node.dataset.money==="1", suf=node.dataset.suffix||""; let t0=null;
  function step(ts){ if(!t0)t0=ts; const p=Math.min((ts-t0)/dur,1); const val=target*(1-Math.pow(1-p,3));
    node.textContent= (money?BRL(val): Math.round(val).toLocaleString("pt-BR"))+suf; if(p<1)requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

function router(){
  const hash=location.hash||"#/login";
  const user=currentUser();

  if(hash.startsWith("#/login")){ return user? go("#/painel") : renderLogin(); }
  if(hash.startsWith("#/cadastro")){ return user? go("#/painel") : renderSignup(); }

function renderOnboarding(user){
  const wed=getWedding(user.id);
  let step=1, temp={...blankWedding(), ...wed};
  const totalSteps=3;
  function draw(){
    if(step>totalSteps) return finish();
    const bar=`<div class="onb-steps">${[1,2,3].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
    let inner="";
    if(step===1){
      const av = temp.photo?`<img src="${temp.photo}">`:esc(initials(temp.brideName||"?"));
      inner=`<span class="eyebrow">Etapa 1 de 3</span><h2>Vamos começar por você</h2>
      <p class="lead">Como você gostaria de ser chamada no seu painel?</p>
      <div class="field"><label>Nome da noiva *</label><input id="f_bride" value="${esc(temp.brideName)}" placeholder="Ex.: Juliana"></div>
      <div class="field"><label>Foto de perfil (opcional)</label>
        <div class="avatar-upload"><div class="avatar-prev" id="avPrev">${av}</div>
          <div><input type="file" id="f_photo" accept="image/png,image/jpeg,image/webp" style="display:none">

            ${temp.photo?`<button class="btn btn-danger btn-sm" id="rmPhoto" style="margin-left:8px">Remover</button>`:""}
            <p class="muted" style="font-size:.76rem;margin-top:8px">JPG, PNG ou WEBP, até 2MB.</p></div></div></div>`;
    } else if(step===2){
      inner=`<span class="eyebrow">Etapa 2 de 3</span><h2>Qual é a data do casamento?</h2>
      <p class="lead">A partir dela calculamos automaticamente quantos dias faltam.</p>
      <div class="field"><label>Data do casamento *</label><input id="f_date" type="date" value="${esc(temp.date)}"></div>
      <div class="field-row"><div class="field"><label>Cidade</label><input id="f_city" value="${esc(temp.city)}" placeholder="Cidade"></div>
      <div class="field"><label>Estado</label><input id="f_state" value="${esc(temp.state)}" placeholder="UF" maxlength="2"></div></div>`;
    } else if(step===3){
      inner=`<span class="eyebrow">Etapa 3 de 3</span><h2>Sobre o planejamento</h2>
      <p class="lead">Você pode alterar tudo isso depois, quando quiser.</p>
      <div class="field"><label>Nome do parceiro(a)</label><input id="f_partner" value="${esc(temp.partnerName)}" placeholder="Ex.: Lucas"></div>
      <div class="field-row"><div class="field"><label>Convidados (estimativa)</label><input id="f_guests" type="number" min="0" value="${esc(temp.guestsEstimate)}" placeholder="120"></div>
      <div class="field"><label>Orçamento aproximado</label><input id="f_budget" type="number" min="0" step="100" value="${esc(temp.budgetTotal||"")}" placeholder="40000"></div></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:.88rem;color:var(--ink-soft)"><input type="checkbox" id="f_tpl" checked> Começar com um checklist sugerido de casamento</label>`;
    }
    const backBtn = step>1?`<button class="btn btn-ghost" id="obBack">Voltar</button>`:`<span></span>`;
    const nextLabel = step===totalSteps?"Preparar meu painel 💍":"Continuar";
    q("#root").innerHTML=`<div class="onb"><div class="onb-card">${bar}${inner}
      <div class="onb-actions">${backBtn}<button class="btn btn-primary" id="obNext">${nextLabel}</button></div></div></div>`;

  function wireStep(){
    const back=q("#obBack"); if(back)back.onclick=()=>{ collect(); step--; draw(); };

    if(step===1){

    return true;
  }

    q("#root").innerHTML=`<div class="onb"><div class="onb-card onb-done">
      <div class="big-ring">${RINGSVG}</div><h2 class="script" style="color:var(--rose);font-size:2.4rem">Preparando seu Painel...</h2>
      <p class="lead" style="margin-top:8px">Estamos organizando tudo para você.</p></div></div>`;
    temp.onboarded=true;
    saveWedding(user.id, {brideName:temp.brideName,partnerName:temp.partnerName,date:temp.date,city:temp.city,state:temp.state,guestsEstimate:temp.guestsEstimate,budgetTotal:temp.budgetTotal,photo:temp.photo,onboarded:true});
    const d=getData(user.id);
    if(temp._tpl && d.tasks.length===0){ d.tasks=CHECKLIST_TEMPLATE.map(t=>({id:uid(),category:t[0],title:t[1],priority:t[2],status:"pendente",due:"",notes:""})); saveData(user.id,d); }
    setTimeout(()=>{ q(".onb-done").innerHTML=`<div class="big-ring">${RINGSVG}</div>
      <h2>Tudo pronto, <span class="script" style="font-size:2.4rem">${esc(temp.brideName)}</span>!</h2>
      <p class="lead" style="margin-top:8px">Seu painel está pronto. Agora vamos construir o seu grande dia.</p>
      <button class="btn btn-primary" id="obGo" style="margin-top:18px">Abrir meu painel</button>`;
      q("#obGo").onclick=()=>go("#/painel"); },1500);
  }
  draw();
}

function setupNotifs(user,wed,d){

function setupSearch(user,d){
  const inp=q("#globalSearch"); if(!inp)return;
  inp.onkeydown=e=>{ if(e.key!=="Enter")return; const term=inp.value.trim().toLowerCase(); if(!term)return;
    const hits=[];
    d.guests.forEach(g=>{ if((g.name+" "+g.surname).toLowerCase().includes(term))hits.push(["Convidado",g.name+" "+g.surname,"convidados"]); });
    d.suppliers.forEach(s=>{ if((s.company+s.category).toLowerCase().includes(term))hits.push(["Fornecedor",s.company,"fornecedores"]); });
    d.tasks.forEach(t=>{ if(t.title.toLowerCase().includes(term))hits.push(["Tarefa",t.title,"checklist"]); });
    d.payments.forEach(p=>{ if(p.description.toLowerCase().includes(term))hits.push(["Pagamento",p.description,"pagamentos"]); });
    d.notes.forEach(n=>{ if((n.title+n.text).toLowerCase().includes(term))hits.push(["Anotação",n.title,"anotacoes"]); });
    const m=el("div",{class:"modal"});
    m.innerHTML=`<div class="modal-head"><h3>Resultados para "${esc(inp.value)}"</h3><button class="modal-x" data-x>&times;</button></div>
      <div class="modal-body">${hits.length?hits.slice(0,20).map(h=>`<a href="#/painel/${h[2]}" data-x style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)"><span>${esc(h[1])}</span><span class="badge-s s-gray">${h[0]}</span></a>`).join(""):`<p class="muted">Nada encontrado.</p>`}</div>`;
    openModal(m); qa("[data-x]",m).forEach(b=>b.onclick=closeModal);
  };
}

/* small helpers for views */
function pageTop(title,sub,btn){ return `<div class="page-top"><div class="page-head"><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}</div>${btn||""}</div>`; }
function emptyState(icon,title,msg,btnLabel,btnAttr){ return `<div class="empty"><div class="em-ic">${svg(icon,28)}</div><h3>${title}</h3><p>${msg}</p>${btnLabel?`<button class="btn btn-primary" ${btnAttr}>${svg("plus",16)} ${btnLabel}</button>`:""}</div>`; }
function badge(status){ const map={
  confirmado:["s-green","Confirmado"], aguardando:["s-amber","Aguardando"], nao_ira:["s-gray","Não irá"],
  pago:["s-green","Pago"], pendente:["s-amber","Pendente"], atrasado:["s-red","Atrasado"],
  contratado:["s-green","Contratado"], pesquisando:["s-gray","Pesquisando"], orcamento:["s-amber","Orçamento recebido"], cancelado:["s-red","Cancelado"],
  desejado:["s-rose","Desejado"], recebido:["s-green","Recebido"],
  concluida:["s-green","Concluída"], em_andamento:["s-amber","Em andamento"],
  alta:["s-red","Alta"], media:["s-amber","Média"], baixa:["s-gray","Baixa"]
}; const m=map[status]||["s-gray",status]; return `<span class="badge-s ${m[0]}">${esc(m[1])}</span>`; }

function crudList(outlet, ctx, cfg){
  const rows=ctx.d[cfg.coll];
  const btn=`<button class="btn btn-primary" data-add>${svg("plus",16)} ${cfg.addLabel}</button>`;
  let html=pageTop(cfg.title, cfg.sub, btn);
  if(cfg.summary) html+=cfg.summary(ctx.d);
  if(!rows.length){ html+=emptyState(cfg.icon, cfg.emptyTitle, cfg.emptyMsg, cfg.addLabel, "data-add"); }
  else {
    html+=`<div class="tbl-wrap"><table class="tbl"><thead><tr>${cfg.columns.map(c=>`<th>${c.label}</th>`).join("")}<th></th></tr></thead><tbody>`;
    rows.forEach(r=>{ html+=`<tr>${cfg.columns.map(c=>`<td>${c.cell(r)}</td>`).join("")}
      <td><div class="row-actions"><button class="icon-btn" data-edit="${r.id}">${svg("edit",15)}</button>
      <button class="icon-btn danger" data-del="${r.id}">${svg("trash",15)}</button></div></td></tr>`; });
    html+=`</tbody></table></div>`;
  }
  outlet.innerHTML=html;
  function openForm(existing){
    formModal({ title: existing?cfg.editTitle:cfg.addTitle, fields:cfg.fields, values:existing||cfg.defaults||{},
      submitLabel: existing?"Salvar":cfg.addLabel,
      onSubmit:obj=>{ cfg.fields.forEach(f=>{ if(f.type==="number") obj[f.key]=+obj[f.key]||0; });
        if(existing){ Object.assign(existing,obj); } else { obj.id=uid(); rows.push(obj); }
        ctx.save(); closeModal(); toast("Informações salvas com sucesso."); ctx.refresh(); } });
  }
  qa("[data-add]",outlet).forEach(b=>b.onclick=()=>openForm(null));
  qa("[data-edit]",outlet).forEach(b=>b.onclick=()=>openForm(rows.find(r=>r.id===b.dataset.edit)));
  qa("[data-del]",outlet).forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.del);
    confirmModal(cfg.delTitle||"Excluir item?", cfg.delMsg||"Esta ação não pode ser desfeita.", ()=>{
      ctx.d[cfg.coll]=rows.filter(x=>x.id!==r.id); ctx.save(); toast("Item excluído."); ctx.refresh(); }); });
}

function dashChecklist(d){

    <div class="stat-lbl" style="margin-bottom:8px">${t.done} de ${t.total} tarefas concluídas</div>
    ${next.length?next.map(x=>`<div class="task"><span class="box"></span><div><div class="tt">${esc(x.title)}</div><div class="meta">${esc(x.category)}${x.due?" · vence "+fmtDate(x.due):""}</div></div></div>`).join(""):`<p class="muted" style="padding:8px 0">Tudo concluído! ❤️</p>`}`;
}
function dashPayments(d){
  if(!d.payments.length) return `<p class="muted" style="padding:10px 0">Nenhum pagamento cadastrado. <a class="link" href="#/painel/pagamentos">Adicionar</a></p>`;

  return up.map(p=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">

const CHK_CATS=["12+ meses antes","9–12 meses","6–9 meses","3–6 meses","1–3 meses","1 mês","1 semana","Dia anterior","Dia do casamento"];
VIEWS.checklist={ title:()=>"Checklist do Casamento", render(outlet,ctx){

  const addBtn=`<button class="btn btn-primary" data-add>${svg("plus",16)} Nova tarefa</button>`;

    .replace("</div></div>",`</div><div style="display:flex;gap:10px;justify-content:center;margin-top:4px"><button class="btn btn-primary" data-add>${svg("plus",16)} Nova tarefa</button><button class="btn btn-ghost" data-tpl>Usar checklist sugerido</button></div></div>`);
  } else {
    html+=`<div class="card" style="margin-bottom:18px"><div class="progress" style="margin-bottom:8px"><i data-w="${t.pct}"></i></div>

    const cats=CHK_CATS.filter(c=>d.tasks.some(x=>x.category===c));
    const others=[...new Set(d.tasks.map(x=>x.category))].filter(c=>!CHK_CATS.includes(c));
    [...cats,...others].forEach(cat=>{ const items=d.tasks.filter(x=>x.category===cat);
      html+=`<div class="card" style="margin-bottom:14px"><div class="card-head"><h3 style="font-size:1.15rem">${esc(cat)}</h3>
        <span class="muted" style="font-size:.8rem">${items.filter(i=>i.status==="concluida").length}/${items.length}</span></div>
        ${items.map(x=>`<div class="task ${x.status==="concluida"?"done":""}"><span class="box" data-toggle="${x.id}">${x.status==="concluida"?svg("check",13).replace(IC.check,'<path d="M20 6 9 17l-5-5"/>'):""}</span>
          <div style="flex:1"><div class="tt">${esc(x.title)}</div><div class="meta">${badge(x.priority)} ${x.due?" · vence "+fmtDate(x.due):""}${x.notes?" · "+esc(x.notes):""}</div></div>

          <button class="icon-btn danger rm" data-del="${x.id}">${svg("trash",14)}</button></div>`).join("")}</div>`; });
  }
  outlet.innerHTML=html;
  const fields=[{key:"title",label:"Tarefa",required:true},{key:"category",label:"Categoria",type:"select",options:CHK_CATS},

    {key:"due",label:"Prazo",type:"date",half:true},{key:"notes",label:"Observação",type:"textarea"}];
  function form(ex){ formModal({title:ex?"Editar tarefa":"Nova tarefa",fields,values:ex||{category:CHK_CATS[3],priority:"media",status:"pendente"},submitLabel:ex?"Salvar":"Adicionar",
    onSubmit:o=>{ if(ex)Object.assign(ex,o); else { o.id=uid(); o.status="pendente"; d.tasks.push(o);} ctx.save(); closeModal(); toast("Tarefa salva."); ctx.refresh(); }}); }
  qa("[data-add]",outlet).forEach(b=>b.onclick=()=>form(null));
  qa("[data-edit]",outlet).forEach(b=>b.onclick=()=>form(d.tasks.find(x=>x.id===b.dataset.edit)));

  qa("[data-toggle]",outlet).forEach(b=>b.onclick=()=>{ const x=d.tasks.find(i=>i.id===b.dataset.toggle); x.status=x.status==="concluida"?"pendente":"concluida"; ctx.save(); ctx.refresh(); });
  const tpl=q("[data-tpl]",outlet); if(tpl)tpl.onclick=()=>{ d.tasks=CHECKLIST_TEMPLATE.map(t=>({id:uid(),category:t[0],title:t[1],priority:t[2],status:"pendente",due:"",notes:""})); ctx.save(); toast("Checklist sugerido adicionado."); ctx.refresh(); };
}};

const GUEST_GROUPS=["Família da noiva","Família do parceiro","Amigos","Trabalho","Outros"];
VIEWS.convidados={ title:()=>"Convidados", render(outlet,ctx){
  const d=ctx.d, g=calcGuests(d);
  const addBtn=`<button class="btn btn-primary" data-add>${svg("plus",16)} Adicionar convidado</button>`;
  let html=pageTop("Lista de Convidados","Sua lista finalmente sob controle.",addBtn);
  if(d.guests.length){
    const donut=donutSVG([{v:g.confirmed,color:"#8FA47E"},{v:g.waiting,color:"#DBC79E"},{v:g.declined,color:"#EBD2CC"}]);
    html+=`<div class="grid g-2" style="margin-bottom:18px"><div class="card"><div class="donut-wrap">${donut}
      <div class="legend"><div><span class="k" style="background:#8FA47E"></span><b>${g.confirmed}</b> Confirmados</div>
      <div><span class="k" style="background:#DBC79E"></span><b>${g.waiting}</b> Aguardando</div>
      <div><span class="k" style="background:#EBD2CC"></span><b>${g.declined}</b> Não irão</div>
      <div><span class="k" style="background:#EFE6DA"></span><b>${g.total}</b> Total</div></div></div></div>
      <div class="card"><div class="card-head"><h3>Filtrar</h3></div>
      <div class="tb-search" style="max-width:none;margin-bottom:12px">${svg("search",18)}<input id="gSearch" placeholder="Buscar por nome..."></div>
      <div class="chips" id="gFilters"><span class="chip on" data-f="todos">Todos</span>
      <span class="chip" data-f="confirmado">Confirmados</span><span class="chip" data-f="aguardando">Aguardando</span>
      <span class="chip" data-f="nao_ira">Não irão</span>${GUEST_GROUPS.map(gr=>`<span class="chip" data-f="grp:${gr}">${gr}</span>`).join("")}</div></div></div>`;
    html+=`<div id="gTable"></div>`;
  } else {
    html+=emptyState("users","Sua lista ainda está vazia","Adicione seu primeiro convidado para começar a acompanhar as confirmações.","Adicionar convidado","data-add");
  }
  outlet.innerHTML=html;
  const fields=[{key:"name",label:"Nome",required:true,half:true},{key:"surname",label:"Sobrenome",half:true},
    {key:"phone",label:"Telefone",type:"tel",half:true},{key:"email",label:"E-mail",type:"email",half:true},
    {key:"group",label:"Grupo / Família",type:"select",options:GUEST_GROUPS,half:true},
    {key:"companions",label:"Acompanhantes",type:"number",min:0,half:true},
    {key:"status",label:"Status",type:"select",options:[["confirmado","Confirmado"],["aguardando","Aguardando"],["nao_ira","Não irá"]]},
    {key:"notes",label:"Observações",type:"textarea"}];
  function form(ex){ formModal({title:ex?"Editar convidado":"Adicionar convidado",fields,values:ex||{status:"aguardando",group:GUEST_GROUPS[0],companions:0},submitLabel:ex?"Salvar":"Adicionar",
    onSubmit:o=>{ o.companions=+o.companions||0; if(ex)Object.assign(ex,o); else {o.id=uid(); d.guests.push(o);} ctx.save(); closeModal(); toast("Convidado salvo."); ctx.refresh(); }}); }
  let filter="todos", search="";
  function drawTable(){ const box=q("#gTable",outlet); if(!box)return;
    let rows=d.guests.filter(x=>{ const okF = filter==="todos"?true: filter.startsWith("grp:")?x.group===filter.slice(4):x.status===filter;
      const okS = !search || (x.name+" "+x.surname).toLowerCase().includes(search); return okF&&okS; });
    if(!rows.length){ box.innerHTML=`<div class="card"><p class="muted" style="text-align:center;padding:20px">Nenhum convidado neste filtro.</p></div>`; return; }
    box.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nome</th><th>Grupo</th><th>Contato</th><th>Acomp.</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(x=>`<tr><td><b>${esc(x.name)} ${esc(x.surname)}</b></td><td>${esc(x.group||"—")}</td><td>${esc(x.phone||x.email||"—")}</td><td>${x.companions||0}</td><td>${badge(x.status)}</td>
      <td><div class="row-actions"><button class="icon-btn" data-edit="${x.id}">${svg("edit",15)}</button><button class="icon-btn danger" data-del="${x.id}">${svg("trash",15)}</button></div></td></tr>`).join("")}
      </tbody></table></div>`;
    qa("[data-edit]",box).forEach(b=>b.onclick=()=>form(d.guests.find(x=>x.id===b.dataset.edit)));
    qa("[data-del]",box).forEach(b=>b.onclick=()=>{ const x=d.guests.find(i=>i.id===b.dataset.del); confirmModal("Excluir convidado?",`${x.name} ${x.surname}`,()=>{ d.guests=d.guests.filter(i=>i.id!==x.id); ctx.save(); toast("Convidado excluído."); ctx.refresh(); }); });
  }
  qa("[data-add]",outlet).forEach(b=>b.onclick=()=>form(null));
  const gf=q("#gFilters",outlet); if(gf)qa(".chip",gf).forEach(c=>c.onclick=()=>{ qa(".chip",gf).forEach(x=>x.classList.remove("on")); c.classList.add("on"); filter=c.dataset.f; drawTable(); });
  const gs=q("#gSearch",outlet); if(gs)gs.oninput=()=>{ search=gs.value.trim().toLowerCase(); drawTable(); };
  drawTable();
}};

    {key:"status",label:"Status do contrato",type:"select",options:[["pesquisando","Pesquisando"],["orcamento","Orçamento recebido"],["contratado","Contratado"],["pago","Pago"],["cancelado","Cancelado"]]},

/* ---- ORÇAMENTO ---- */
VIEWS.orcamento={ title:()=>"Meu Orçamento", render(outlet,ctx){
  const {wed,d}=ctx; const s=calcSuppliers(d);
  const total=+wed.budgetTotal||0; const available=total-s.contracted; const usedPct= total? Math.min(Math.round(s.contracted/total*100),999):0;
  let html=pageTop("Meu Orçamento","Saiba para onde está indo cada real do seu casamento.",
    `<button class="btn btn-ghost" data-editbudget>${svg("edit",16)} Definir orçamento total</button>`);
  if(!total && !d.suppliers.length){
    html+=emptyState("wallet","Seu orçamento ainda não foi configurado","Defina o valor total que pretende investir e cadastre seus fornecedores — os cálculos são automáticos.","Definir orçamento","data-editbudget");
  } else {
    html+=`<div class="grid g-4" style="margin-bottom:18px">
      <div class="card"><div class="stat-lbl">Orçamento total</div><div class="stat-num" data-count="${total}" data-money="1">R$ 0</div></div>
      <div class="card"><div class="stat-lbl">Contratado</div><div class="stat-num" data-count="${s.contracted}" data-money="1">R$ 0</div></div>
      <div class="card"><div class="stat-lbl">Pago</div><div class="stat-num" data-count="${s.paid}" data-money="1" style="color:var(--sage)">R$ 0</div></div>
      <div class="card"><div class="stat-lbl">Disponível</div><div class="stat-num" data-count="${available}" data-money="1" style="color:${available<0?"var(--red)":"var(--rose-d)"}">R$ 0</div></div></div>`;
    if(total){ const barPct=Math.min(usedPct,100);
      html+=`<div class="card" style="margin-bottom:18px"><div class="card-head"><h3 style="font-size:1.15rem">Uso do orçamento</h3><b>${usedPct}%</b></div>
        <div class="progress"><i data-w="${barPct}" style="background:${usedPct>100?"linear-gradient(90deg,#CF7A72,#D9A24a)":"linear-gradient(90deg,var(--rose),var(--gold-soft))"}"></i></div>`;
      if(s.contracted>total) html+=`<div class="alert warn" style="margin-top:14px">${svg("warn",18)}<div>Seu orçamento previsto foi ultrapassado em <b>${BRL(s.contracted-total)}</b>.</div></div>`;
      else if(usedPct>=90) html+=`<div class="alert info" style="margin-top:14px">${svg("warn",18)}<div>Você já comprometeu ${usedPct}% do seu orçamento.</div></div>`;
      html+=`</div>`;
    }
    // by category (from suppliers)
    const byCat={}; d.suppliers.forEach(x=>{ byCat[x.category]=byCat[x.category]||{c:0,p:0}; byCat[x.category].c+=(+x.valorTotal||0); byCat[x.category].p+=(+x.valorPago||0); });
    const cats=Object.entries(byCat).sort((a,b)=>b[1].c-a[1].c);
    if(cats.length){ const max=Math.max(...cats.map(c=>c[1].c),1);
      html+=`<div class="card"><div class="card-head"><h3>Por categoria</h3><span class="muted" style="font-size:.8rem">contratado</span></div>
      ${cats.map(([cat,v])=>`<div style="display:flex;align-items:center;gap:12px;margin:12px 0">
        <div style="width:120px;font-size:.88rem">${esc(cat)}</div>
        <div class="progress" style="flex:1"><i data-w="${Math.round(v.c/max*100)}"></i></div>
        <div style="width:110px;text-align:right;font-family:var(--serif)">${BRL(v.c)}</div>
        <div style="width:60px;text-align:right" class="stat-lbl">${total?Math.round(v.c/total*100):0}%</div></div>`).join("")}</div>`;
    }
  }
  outlet.innerHTML=html;
  qa("[data-editbudget]",outlet).forEach(b=>b.onclick=()=>{ formModal({title:"Orçamento total",fields:[{key:"budgetTotal",label:"Quanto pretende investir no casamento? (R$)",type:"number",min:0,step:"100",required:true}],values:{budgetTotal:total},submitLabel:"Salvar",
    onSubmit:o=>{ wed.budgetTotal=+o.budgetTotal||0; ctx.saveWed(); closeModal(); toast("Orçamento atualizado."); ctx.refresh(); }}); });
}};

    html+=`<div class="grid g-4" style="margin-bottom:18px">
      <div class="card"><div class="stat-lbl">Pago</div><div class="stat-num" data-count="${agg.paid}" data-money="1" style="color:var(--sage)">R$ 0</div></div>
      <div class="card"><div class="stat-lbl">Pendente</div><div class="stat-num" data-count="${agg.pending}" data-money="1" style="color:var(--amber-t)">R$ 0</div></div>
      <div class="card"><div class="stat-lbl">Atrasado</div><div class="stat-num" data-count="${agg.overdue}" data-money="1" style="color:var(--red)">R$ 0</div></div>
      <div class="card"><div class="stat-lbl">Total</div><div class="stat-num" data-count="${agg.total}" data-money="1">R$ 0</div></div></div>`;
    const rows=[...d.payments].sort((a,b)=>(a.due||"").localeCompare(b.due||""));
    html+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Descrição</th><th>Categoria</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td><b>${esc(p.description)}</b></td><td>${esc(p.category||"—")}</td><td>${p.due?fmtDate(p.due):"—"}</td><td>${BRL(p.value)}</td><td>${badge(p.status)}</td>
      <td><div class="row-actions">${p.status!=="pago"?`<button class="icon-btn" title="Marcar como pago" data-pay="${p.id}" style="color:var(--sage)">${svg("check",15).replace(IC.check,'<path d="M20 6 9 17l-5-5"/>')}</button>`:""}
      <button class="icon-btn" data-edit="${p.id}">${svg("edit",15)}</button><button class="icon-btn danger" data-del="${p.id}">${svg("trash",15)}</button></div></td></tr>`).join("")}
      </tbody></table></div>`;
  } else html+=emptyState("card","Nenhum pagamento cadastrado","Cadastre parcelas e vencimentos para nunca esquecer um compromisso.","Adicionar pagamento","data-add");
  outlet.innerHTML=html;
  const fields=[{key:"description",label:"Descrição",required:true},{key:"category",label:"Categoria",half:true},
    {key:"value",label:"Valor (R$)",type:"number",min:0,step:"0.01",required:true,half:true},
    {key:"due",label:"Vencimento",type:"date",half:true},
    {key:"status",label:"Status",type:"select",options:[["pendente","Pendente"],["pago","Pago"],["atrasado","Atrasado"]],half:true},
    {key:"method",label:"Forma de pagamento",half:true},{key:"notes",label:"Observação",type:"textarea"}];
  function form(ex){ formModal({title:ex?"Editar pagamento":"Adicionar pagamento",fields,values:ex||{status:"pendente",value:0},submitLabel:ex?"Salvar":"Adicionar",
    onSubmit:o=>{ o.value=+o.value||0; if(ex)Object.assign(ex,o); else {o.id=uid(); d.payments.push(o);} ctx.save(); closeModal(); toast("Pagamento salvo."); ctx.refresh(); }}); }
  qa("[data-add]",outlet).forEach(b=>b.onclick=()=>form(null));
  qa("[data-edit]",outlet).forEach(b=>b.onclick=()=>form(d.payments.find(x=>x.id===b.dataset.edit)));
  qa("[data-pay]",outlet).forEach(b=>b.onclick=()=>{ const p=d.payments.find(x=>x.id===b.dataset.pay); p.status="pago"; ctx.save(); toast("Pagamento marcado como pago."); ctx.refresh(); });
  qa("[data-del]",outlet).forEach(b=>b.onclick=()=>{ const p=d.payments.find(x=>x.id===b.dataset.del); confirmModal("Excluir pagamento?",esc(p.description),()=>{ d.payments=d.payments.filter(i=>i.id!==p.id); ctx.save(); toast("Pagamento excluído."); ctx.refresh(); }); });
}};

/* ---- GALERIA & INSPIRAÇÕES (image upload) ---- */
function imageModule(coll,title,sub,emptyMsg){
  return { title:()=>title, render(outlet,ctx){
    const d=ctx.d, items=d[coll];
    let html=pageTop(title,sub,`<button class="btn btn-primary" data-pick>${svg("plus",16)} Enviar imagens</button>`);
    if(!items.length){ html+=emptyState("image",title==="Galeria do Casamento"?"Sua galeria está vazia":"Nenhuma inspiração ainda",emptyMsg,"Enviar imagens","data-pick"); }
    else { html+=`<div class="gal">${items.map(im=>`<div class="tile"><img src="${im.src}" alt="${esc(im.title||"")}"><button class="icon-btn danger rm" data-del="${im.id}">${svg("trash",14)}</button></div>`).join("")}
      <label class="add">${svg("plus",26)}<input type="file" accept="image/*" multiple style="display:none" data-input></label></div>`; }
    html+=`<input type="file" accept="image/*" multiple style="display:none" id="picker">`;
    outlet.innerHTML=html;
    function handle(files){ let added=0; [...files].forEach(f=>{ if(!f.type.startsWith("image/"))return; if(f.size>3*1024*1024){ toast(`"${f.name}" maior que 3MB.`,"err"); return; }
      const rd=new FileReader(); rd.onload=()=>{ items.push({id:uid(),src:rd.result,title:f.name}); ctx.save(); ctx.refresh(); }; rd.readAsDataURL(f); added++; });
      if(added)toast("Imagem(ns) adicionada(s)."); }
    const picker=q("#picker",outlet); qa("[data-pick]",outlet).forEach(b=>b.onclick=()=>picker.click()); picker.onchange=()=>handle(picker.files);
    const inl=q("[data-input]",outlet); if(inl)inl.onchange=()=>handle(inl.files);
    qa("[data-del]",outlet).forEach(b=>b.onclick=()=>{ d[coll]=items.filter(i=>i.id!==b.dataset.del); ctx.save(); toast("Imagem removida."); ctx.refresh(); });
  }};
}
VIEWS.galeria=imageModule("gallery","Galeria do Casamento","Cada detalhe que você quer guardar.","Envie fotos e imagens do seu casamento e inspirações.");
VIEWS.inspiracoes=imageModule("inspirations","Minhas Inspirações","O quadro de ideias do seu grande dia.","Salve referências de decoração, vestido, flores e muito mais.");

/* ---- MESAS ---- */
VIEWS.mesas={ title:()=>"Mesas dos Convidados", render(outlet,ctx){
  const d=ctx.d;
  let html=pageTop("Organização das Mesas","Cada convidado no lugar certo.",`<button class="btn btn-primary" data-add>${svg("plus",16)} Nova mesa</button>`);
  const seated=new Set(); d.tables.forEach(t=>(t.guestIds||[]).forEach(id=>seated.add(id)));
  const unseated=d.guests.filter(g=>!seated.has(g.id));
  if(!d.tables.length){ html+=emptyState("chair","Nenhuma mesa criada ainda","Crie mesas, defina a capacidade e distribua seus convidados.","Nova mesa","data-add"); }
  else {
    html+=`<div class="grid g-3">${d.tables.map(t=>{ const gs=(t.guestIds||[]).map(id=>d.guests.find(g=>g.id===id)).filter(Boolean);
      return `<div class="card hover"><div class="card-head"><h3 style="font-size:1.15rem">${esc(t.name)}</h3>
        <div class="row-actions"><button class="icon-btn" data-edit="${t.id}">${svg("edit",14)}</button><button class="icon-btn danger" data-del="${t.id}">${svg("trash",14)}</button></div></div>
        <div class="stat-lbl" style="margin-bottom:8px">${gs.length}/${t.capacity} lugares ocupados</div>
        <div class="progress" style="margin-bottom:12px"><i data-w="${t.capacity?Math.min(gs.length/t.capacity*100,100):0}"></i></div>
        ${gs.map(g=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem"><span>${esc(g.name)} ${esc(g.surname)}</span><button class="icon-btn danger" data-unseat="${t.id}|${g.id}" style="width:26px;height:26px">${svg("x",12)}</button></div>`).join("")||`<p class="muted" style="font-size:.85rem">Mesa vazia</p>`}
        <button class="btn btn-soft btn-sm btn-block" data-seat="${t.id}" style="margin-top:12px">${svg("plus",14)} Adicionar convidado</button></div>`; }).join("")}</div>`;
    html+=`<div class="card" style="margin-top:18px"><div class="card-head"><h3 style="font-size:1.15rem">Sem mesa (${unseated.length})</h3></div>
      ${unseated.length?`<div class="chips">${unseated.map(g=>`<span class="chip">${esc(g.name)} ${esc(g.surname)}</span>`).join("")}</div>`:`<p class="muted">Todos os convidados estão acomodados. 🎉</p>`}</div>`;
  }
  outlet.innerHTML=html;
  function form(ex){ formModal({title:ex?"Editar mesa":"Nova mesa",fields:[{key:"name",label:"Nome da mesa",required:true,half:true},{key:"capacity",label:"Capacidade",type:"number",min:1,required:true,half:true}],values:ex||{capacity:8},submitLabel:ex?"Salvar":"Criar mesa",
    onSubmit:o=>{ o.capacity=+o.capacity||8; if(ex)Object.assign(ex,o); else {o.id=uid(); o.guestIds=[]; d.tables.push(o);} ctx.save(); closeModal(); toast("Mesa salva."); ctx.refresh(); }}); }
  qa("[data-add]",outlet).forEach(b=>b.onclick=()=>form(null));
  qa("[data-edit]",outlet).forEach(b=>b.onclick=()=>form(d.tables.find(x=>x.id===b.dataset.edit)));
  qa("[data-del]",outlet).forEach(b=>b.onclick=()=>{ const t=d.tables.find(x=>x.id===b.dataset.del); confirmModal("Excluir mesa?",esc(t.name),()=>{ d.tables=d.tables.filter(i=>i.id!==t.id); ctx.save(); toast("Mesa excluída."); ctx.refresh(); }); });
  qa("[data-unseat]",outlet).forEach(b=>b.onclick=()=>{ const [tid,gid]=b.dataset.unseat.split("|"); const t=d.tables.find(x=>x.id===tid); t.guestIds=t.guestIds.filter(id=>id!==gid); ctx.save(); ctx.refresh(); });
  qa("[data-seat]",outlet).forEach(b=>b.onclick=()=>{ const t=d.tables.find(x=>x.id===b.dataset.seat);
    const avail=d.guests.filter(g=>!d.tables.some(tt=>(tt.guestIds||[]).includes(g.id)));
    if(!avail.length)return toast("Todos os convidados já têm mesa.","err");
    formModal({title:`Adicionar em ${t.name}`,fields:[{key:"gid",label:"Convidado",type:"select",options:avail.map(g=>[g.id,`${g.name} ${g.surname}`])}],values:{},submitLabel:"Adicionar",
      onSubmit:o=>{ if((t.guestIds||[]).length>=t.capacity){ toast("Mesa cheia.","err"); return; } t.guestIds=t.guestIds||[]; t.guestIds.push(o.gid); ctx.save(); closeModal(); toast("Convidado acomodado."); ctx.refresh(); }}); });
}};

    <div class="card"><div class="card-head"><h3>Segurança</h3></div>
      <div class="field"><label>Senha atual</label><input id="pwCur" type="password"></div>
      <div class="field-row"><div class="field"><label>Nova senha</label><input id="pwNew" type="password"></div>
      <div class="field"><label>Confirmar</label><input id="pwConf" type="password"></div></div>
      <button class="btn btn-primary" id="cfgPw">Alterar senha</button></div>

    <div class="card"><div class="card-head"><h3>Dados de demonstração</h3></div>
      <p class="muted" style="margin-bottom:14px">Preencha ou limpe rapidamente o painel com dados de exemplo (Juliana & Lucas) para visualizar como tudo funciona.</p>

  const pick=q("#cfgPick"),file=q("#cfgPhoto");

  file.onchange=()=>{ const f=file.files[0]; if(!f)return; if(f.size>2*1024*1024)return toast("Imagem maior que 2MB.","err");

  const rm=q("#cfgRm"); if(rm)rm.onclick=()=>{ wed.photo=null; ctx.saveWed(); ctx.refresh(); };

  q("#root").innerHTML=`<div class="app on">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand"><span class="ring">${RINGSVG}</span> Administração</div>
      <div class="sb-profile"><div class="sb-avatar admin-badge">${svg("shield",26)}</div><div class="nm">${esc(user.email.split("@")[0])}</div><div class="days">Conta do dono</div></div>
      <nav class="sb-nav">
        <a class="nav-item active">${svg("chart",20,"ic")}<span>Visão geral</span></a>
        <a class="nav-item" href="#/painel">${svg("home",20,"ic")}<span>Meu painel</span></a>
      </nav>
      <div class="sb-foot"><button class="btn btn-ghost btn-block btn-sm" onclick="logout()">${svg("logout",16)} Sair</button></div>
    </aside>
    <div class="main"><header class="topbar"><div class="tb-left"><h1>Administração — Painel da Noiva</h1></div></header>
    <main class="content" id="viewOutlet">
      <div class="grid g-4 stagger" style="margin-bottom:20px">
        <div class="card"><div class="stat-lbl">Total de contas</div><div class="stat-num" data-count="${users.length}">0</div></div>
        <div class="card"><div class="stat-lbl">Ativas</div><div class="stat-num" data-count="${stat("active")}" style="color:var(--sage)">0</div></div>
        <div class="card"><div class="stat-lbl">Bloqueadas</div><div class="stat-num" data-count="${stat("blocked")}" style="color:var(--red)">0</div></div>
        <div class="card"><div class="stat-lbl">Pendentes</div><div class="stat-num" data-count="${stat("pending_activation")}" style="color:var(--amber-t)">0</div></div>
      </div>
      <div class="card"><div class="card-head"><h3>Contas cadastradas</h3></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>E-mail</th><th>Papel</th><th>Cadastro</th><th>Último acesso</th><th>Status</th><th></th></tr></thead><tbody>
        ${users.map(u=>{ const w=getWedding(u.id);
          return `<tr><td><b>${esc(u.email)}</b>${w.brideName?`<div class="stat-lbl">${esc(w.brideName)}${w.date?" · "+fmtDate(w.date):""}</div>`:""}</td>

          <td>${fmtDate(new Date(u.createdAt).toISOString().slice(0,10))}</td>
          <td>${u.lastLoginAt?fmtDate(new Date(u.lastLoginAt).toISOString().slice(0,10)):"—"}</td>
